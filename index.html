<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#160b07">
<meta name="description" content="Классические русские шашки — игра против компьютера или вдвоём.">
<title>Шашки — Classic</title>
<style>
:root{--bg:#100806;--panel:#23120c;--panel2:#32190f;--line:#6f3d1c;--gold:#e3ad62;--cream:#f5dca9;--brown:#552817;--red:#b73330;--black:#181a20;--text:#fff5e4;--muted:#c4a487;--board:min(74vh,72vw,700px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 8%,#4c2615 0,#28130c 35%,#100806 78%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select{font:inherit}button{touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column}.top{height:66px;flex:0 0 66px;display:flex;align-items:center;justify-content:space-between;padding:10px max(12px,3vw);background:linear-gradient(#3b1f12,#21110b);border-bottom:1px solid #73421f;box-shadow:0 4px 20px #0008;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.1em}.brand-mark{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#777b85 0 7%,#343740 9% 44%,#0c0d11 47%);box-shadow:inset 0 1px 2px #fff7,0 2px 8px #0009}.top-actions{display:flex;gap:8px}.btn{border:1px solid #754321;border-radius:12px;padding:9px 13px;color:var(--text);background:#341b10;box-shadow:inset 0 1px #fff2,0 3px 10px #0005}.btn:hover{background:#4a2818}.btn.primary{color:#2b160b;font-weight:900;background:linear-gradient(#efc37e,#bd7832);border-color:#f4ce94}.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(190px,270px) 1fr minmax(190px,270px);gap:20px;align-items:center;justify-content:center;padding:14px max(12px,3vw)}.side{background:linear-gradient(145deg,#2b170fdc,#180c09dc);border:1px solid #6d3c1c;border-radius:18px;padding:14px;box-shadow:0 18px 45px #0008,inset 0 1px #fff1;backdrop-filter:blur(8px)}.player{display:flex;align-items:center;gap:10px;padding:10px;border-radius:13px;background:#11090699;border:1px solid #5b321c}.avatar{width:43px;height:43px;flex:0 0 43px;border-radius:50%;box-shadow:inset 0 2px 3px #fff5,0 3px 10px #0008}.avatar.red{background:radial-gradient(circle at 35% 28%,#f06c5d,#b22f2e 48%,#581516)}.avatar.black{background:radial-gradient(circle at 35% 28%,#686b74,#2a2c34 48%,#08090d)}.pname{font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:2px}.turn{margin-left:auto;width:10px;height:10px;border-radius:50%;background:#4b3d31}.turn.active{background:#efbf6c;box-shadow:0 0 12px #efbf6c}.score{display:flex;justify-content:space-between;margin:13px 2px 8px;color:var(--muted);font-size:13px}.score b{font-size:18px;color:var(--text)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:9px;border-radius:11px;border:1px solid #5a321d;background:#12090799}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}.center{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.status{min-height:34px;display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:13px}.badge{padding:6px 10px;border-radius:999px;border:1px solid #d59a5460;background:#d59a541c;color:#f2cb91;font-weight:800}.board-frame{padding:10px;border-radius:24px;background:linear-gradient(135deg,#7e3b17,#d28a3c 47%,#703214);box-shadow:0 25px 60px #000b,0 2px 0 #f2b76d66,inset 0 1px #ffe3a044}.board{position:relative;width:var(--board);height:var(--board);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:5px solid #3a1d11;border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 2px #d39a5d44}.cell{position:relative;display:grid;place-items:center;user-select:none;-webkit-tap-highlight-color:transparent}.cell.light{background:linear-gradient(145deg,#ffe9bc,#e9c98f)}.cell.dark{background:linear-gradient(145deg,#63311b,#3e1c11)}.cell.selectable{cursor:pointer}.cell.selected{box-shadow:inset 0 0 0 4px #ffd274,inset 0 0 22px #ffd27466}.cell.move::after{content:"";position:absolute;width:24%;height:24%;border-radius:50%;background:#f4c76e;box-shadow:0 0 16px #f4c76e}.cell.capture::after{content:"";position:absolute;width:56%;height:56%;border-radius:50%;border:3px solid #f4c76e;box-shadow:0 0 14px #f4c76e66}.anim-layer{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden;border-radius:6px}.piece{width:78%;height:78%;border-radius:50%;position:relative;z-index:2;box-shadow:0 7px 10px #0009,inset 0 2px 3px #fff6,inset 0 -5px 8px #0008;transition:transform .12s ease,filter .12s ease}.piece:hover{transform:translateY(-2px)}.piece{will-change:transform,opacity,filter}.cell.move::after,.cell.capture::after{animation:targetIn .24s cubic-bezier(.2,.8,.2,1)}@keyframes targetIn{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}.cell.selected{animation:selectedIn .18s ease-out}@keyframes selectedIn{from{box-shadow:inset 0 0 0 0 #ffd274,inset 0 0 0 #ffd27400}to{box-shadow:inset 0 0 0 4px #ffd274,inset 0 0 22px #ffd27466}}.piece.land{animation:land .28s cubic-bezier(.16,1,.3,1)}@keyframes land{0%{transform:scale(.84) translateY(-3px);filter:brightness(1.35)}65%{transform:scale(1.045) translateY(0);filter:brightness(1.12)}100%{transform:scale(1);filter:brightness(1)}}.piece.captured{animation:captured .24s ease-in forwards}@keyframes captured{to{transform:scale(.2) rotate(20deg);opacity:0;filter:brightness(1.8)}}.piece.kinged{animation:kinged .5s cubic-bezier(.2,.8,.2,1)}@keyframes kinged{0%{transform:scale(.75) rotate(-12deg);filter:brightness(1.8)}55%{transform:scale(1.14) rotate(4deg);filter:brightness(1.45)}100%{transform:scale(1) rotate(0);filter:brightness(1)}}.piece.red{background:radial-gradient(circle at 32% 25%,#fa6b5d,#c83e3b 29%,#902425 62%,#5b1518);border:3px solid #741d1f}.piece.black{background:radial-gradient(circle at 32% 25%,#656870,#343740 29%,#1e2028 62%,#08090d);border:3px solid #0e0f13}.piece.king:after{content:"♛";position:absolute;inset:0;display:grid;place-items:center;color:#ffd783;text-shadow:0 2px 3px #000;font-size:44%;font-weight:900}.piece.hint{animation:pulse .9s infinite alternate}@keyframes pulse{to{filter:brightness(1.25)}}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:11px}.hint{font-size:12px;color:#b89474;margin-top:9px;text-align:center}.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:#060403cf;backdrop-filter:blur(9px)}.modal{width:min(540px,94vw);background:linear-gradient(145deg,#321a10,#180d09);border:1px solid #855029;border-radius:22px;padding:23px;box-shadow:0 30px 80px #000b,inset 0 1px #fff2}.modal h1{margin:0 0 7px;font-size:28px}.modal p{margin:0;color:var(--muted);line-height:1.5}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:17px 0}.mode-grid button{padding:13px;border-radius:13px;border:1px solid #65401f;background:#1d0e0a;color:var(--text);font-weight:900}.mode-grid button.active{border-color:#e5b36d;background:#663618}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;color:#ddc5aa}.row select{padding:8px;border-radius:9px;background:#130906;color:#fff;border:1px solid #714220}.modal-actions{display:flex;gap:8px;justify-content:center;margin-top:15px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);z-index:50;background:#24120b;border:1px solid #87502a;border-radius:999px;padding:9px 13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:980px){:root{--board:min(88vw,70vh,680px)}.layout{display:flex;overflow:auto;padding:7px}.side{display:none}.top{height:56px;flex-basis:56px}.brand span{display:none}.hint{display:none}}
@media(max-height:690px) and (min-width:981px){:root{--board:min(78vh,65vw,620px)}.layout{padding-top:3px;padding-bottom:3px}.side{padding:10px}}
</style>
</head>
<body>
<div id="app">
<header class="top"><div class="brand"><div class="brand-mark"></div><span>ШАШКИ</span></div><div class="top-actions"><button class="btn" id="soundBtn">🔊</button><button class="btn" id="menuBtn">☰ Меню</button></div></header>
<main class="layout">
<aside class="side"><div class="player"><div class="avatar black"></div><div><div class="pname">Компьютер</div><div class="sub">Чёрные</div></div><div class="turn" id="blackTurn"></div></div><div class="score"><span>На доске</span><b id="blackCount">12</b></div><div class="stats"><div class="stat"><b id="blackCaptured">0</b><span>сбито</span></div><div class="stat"><b id="blackKings">0</b><span>дамок</span></div></div></aside>
<section class="center"><div class="status"><span class="badge" id="turnBadge">Ход красных</span><span id="statusText">Выберите шашку</span></div><div class="board-frame"><div class="board" id="board" aria-label="Шашечная доска"><div class="anim-layer" id="animLayer"></div></div></div><div class="controls"><button class="btn primary" id="newBtn">Новая игра</button><button class="btn" id="undoBtn">↶ Отменить</button></div><div class="hint">Обязательное взятие · выберите шашку и клетку назначения</div></section>
<aside class="side"><div class="player"><div class="avatar red"></div><div><div class="pname">Вы</div><div class="sub">Красные</div></div><div class="turn active" id="redTurn"></div></div><div class="score"><span>На доске</span><b id="redCount">12</b></div><div class="stats"><div class="stat"><b id="redCaptured">0</b><span>сбито</span></div><div class="stat"><b id="redKings">0</b><span>дамок</span></div></div></aside>
</main></div>
<div class="overlay" id="menu"><div class="modal"><h1>Шашки</h1><p>Русские шашки с обязательным взятием, дамками и умным компьютером.</p><div class="mode-grid"><button id="aiMode" class="active">🤖 Компьютер</button><button id="twoMode">👥 Два игрока</button></div><div class="row"><span>Сложность</span><select id="difficulty"><option value="1">Новичок</option><option value="2" selected>Сильный</option><option value="3">Мастер</option><option value="4">Гроссмейстер</option><option value="5">Турнирный</option></select></div><div class="row"><span>Звук</span><button class="btn" id="menuSound">Включён</button></div><div class="modal-actions"><button class="btn primary" id="startBtn">Начать игру</button><button class="btn" id="continueBtn">Продолжить</button></div></div></div>
<div class="overlay hidden" id="result"><div class="modal"><h1 id="resultTitle">Победа!</h1><p id="resultText"></p><div class="stats" style="margin-top:15px"><div class="stat"><b id="resultMoves">0</b><span>ходов</span></div><div class="stat"><b id="resultCaptures">0</b><span>взятий</span></div></div><div class="modal-actions"><button class="btn primary" id="againBtn">Играть ещё</button><button class="btn" id="resultMenuBtn">В меню</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="/sdk.js" async onload="window.dispatchEvent(new Event('yandex-sdk-ready'))"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const DIRS=[[-1,-1],[-1,1],[1,-1],[1,1]];
const clone=b=>b.map(r=>r.slice());
const color=p=>p?p.toLowerCase():null;
const king=p=>p==='R'||p==='B';
const opp=c=>c==='r'?'b':'r';
const inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const forward=c=>c==='r'?-1:1;
let ysdk=null,worker=null,aiBusy=false,aiRequest=0,aiTimer=null,aiWatchdog=null,mode='ai',difficulty=2,soundOn=true,gameStarted=false,toastTimer=null;
const S={board:[],turn:'r',selected:null,legal:[],history:[],captures:{r:0,b:0},moves:0,winner:null,chain:null,animating:false};

function initial(){const b=Array.from({length:8},()=>Array(8).fill(null));for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2)b[r][c]='b';for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2)b[r][c]='r';return b}
function captures(b,r,c,p){const out=[],co=color(p);if(king(p)){for(const[dR,dC]of DIRS){let rr=r+dR,cc=c+dC,e=null;while(inb(rr,cc)){if(b[rr][cc]){if(color(b[rr][cc])===co||e)break;e=[rr,cc]}else if(e)out.push({from:[r,c],to:[rr,cc],capture:e.slice()});rr+=dR;cc+=dC}}}else{for(const[dR,dC]of DIRS){const mr=r+dR,mc=c+dC,tr=r+2*dR,tc=c+2*dC;if(inb(tr,tc)&&b[mr]?.[mc]&&color(b[mr][mc])===opp(co)&&!b[tr][tc])out.push({from:[r,c],to:[tr,tc],capture:[mr,mc]})}}return out}
function moves(b,r,c,p){const out=[],co=color(p);if(king(p)){for(const[dR,dC]of DIRS){let rr=r+dR,cc=c+dC;while(inb(rr,cc)&&!b[rr][cc]){out.push({from:[r,c],to:[rr,cc],capture:null});rr+=dR;cc+=dC}}}else{const dR=forward(co);for(const dC of[-1,1]){const rr=r+dR,cc=c+dC;if(inb(rr,cc)&&!b[rr][cc])out.push({from:[r,c],to:[rr,cc],capture:null})}}return out}
function legal(b,co){const cs=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(color(p)===co)cs.push(...captures(b,r,c,p))}if(cs.length)return cs;const ms=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(color(p)===co)ms.push(...moves(b,r,c,p))}return ms}
function apply(b,m){const nb=clone(b);let p=nb[m.from[0]][m.from[1]];nb[m.from[0]][m.from[1]]=null;if(m.capture)nb[m.capture[0]][m.capture[1]]=null;if(!king(p)&&((color(p)==='r'&&m.to[0]===0)||(color(p)==='b'&&m.to[0]===7)))p=p.toUpperCase();nb[m.to[0]][m.to[1]]=p;return {board:nb,piece:p}}
function snapshot(){return {board:clone(S.board),turn:S.turn,captures:{...S.captures},moves:S.moves,chain:S.chain?S.chain.slice():null}}
function restore(x){S.animating=false;S.board=clone(x.board);S.turn=x.turn;S.captures={...x.captures};S.moves=x.moves;S.chain=x.chain?x.chain.slice():null;S.selected=null;S.legal=legal(S.board,S.turn);S.winner=null}

function render(){const by=new Map();for(const m of S.legal){const k=m.from.join(',');if(!by.has(k))by.set(k,[]);by.get(k).push(m)}$('board').querySelectorAll('.cell').forEach(x=>x.remove());for(let r=0;r<8;r++)for(let c=0;c<8;c++){const cell=document.createElement('div');cell.className='cell '+((r+c)%2?'dark':'light');cell.dataset.r=r;cell.dataset.c=c;const key=r+','+c;if(S.selected?.[0]===r&&S.selected?.[1]===c)cell.classList.add('selected');if(by.has(key))cell.classList.add('selectable');const target=S.selected&&S.legal.find(m=>m.from[0]===S.selected[0]&&m.from[1]===S.selected[1]&&m.to[0]===r&&m.to[1]===c);if(target)cell.classList.add(target.capture?'capture':'move');cell.addEventListener('click',()=>clickCell(r,c));const p=S.board[r][c];if(p){const el=document.createElement('div');el.className='piece '+(color(p)==='r'?'red':'black')+(king(p)?' king':'');if(by.has(key))el.classList.add('hint');cell.appendChild(el)}$('board').appendChild(cell)}updateUI()}
function updateUI(){const flat=S.board.flat();$('redCount').textContent=flat.filter(p=>color(p)==='r').length;$('blackCount').textContent=flat.filter(p=>color(p)==='b').length;$('redCaptured').textContent=S.captures.r;$('blackCaptured').textContent=S.captures.b;$('redKings').textContent=flat.filter(p=>p==='R').length;$('blackKings').textContent=flat.filter(p=>p==='B').length;$('redTurn').classList.toggle('active',S.turn==='r');$('blackTurn').classList.toggle('active',S.turn==='b');$('turnBadge').textContent=S.turn==='r'?'Ход красных':'Ход чёрных';$('statusText').textContent=aiBusy?'Компьютер думает…':S.chain?'Продолжайте взятие':'Выберите шашку'}
function clickCell(r,c){
  if(S.winner||aiBusy||S.animating||(mode==='ai'&&S.turn==='b')) return;
  // Recalculate legal moves on every user interaction. This prevents a stale
  // move list (for example after restoring a saved game) from making the board
  // appear frozen.
  const currentLegal=legal(S.board,S.turn);
  S.legal=currentLegal;
  const chosen=S.selected && currentLegal.find(m=>m.from[0]===S.selected[0]&&m.from[1]===S.selected[1]&&m.to[0]===r&&m.to[1]===c);
  if(chosen){make(chosen);return}
  const p=S.board[r][c];
  if(p&&color(p)===S.turn){
    const ms=currentLegal.filter(m=>m.from[0]===r&&m.from[1]===c);
    if(ms.length){S.selected=[r,c];S.legal=ms;render();return}
    // If this is a friendly piece that cannot move because another piece
    // has a mandatory capture, keep the selection clear and explain why.
    if(currentLegal.some(m=>m.capture)){S.selected=null;toast('Нужно сделать обязательное взятие');render()}
  }
}
function cellAt(r,c){return $('board').querySelector(`.cell[data-r="${r}"][data-c="${c}"]`)}
function animateMove(m){
  if(!m||S.animating)return;
  S.animating=true; S.history.push(snapshot());
  const layer=$('animLayer'), source=cellAt(m.from[0],m.from[1]), target=cellAt(m.to[0],m.to[1]);
  const piece=source?.querySelector('.piece');
  if(!piece||!target){commitMove(m);return}
  const br=$('board').getBoundingClientRect(), sr=source.getBoundingClientRect(), tr=target.getBoundingClientRect();
  const ghost=piece.cloneNode(true);
  ghost.style.position='absolute'; ghost.style.left=(sr.left-br.left+(sr.width-piece.offsetWidth)/2)+'px'; ghost.style.top=(sr.top-br.top+(sr.height-piece.offsetHeight)/2)+'px';
  ghost.style.width=piece.offsetWidth+'px'; ghost.style.height=piece.offsetHeight+'px'; ghost.style.margin='0'; ghost.style.transform='translate3d(0,0,0)'; ghost.style.transition='none'; ghost.classList.remove('hint'); layer.appendChild(ghost); piece.style.opacity='0';
  let captured=null;
  if(m.capture){const cc=cellAt(m.capture[0],m.capture[1]);captured=cc?.querySelector('.piece');if(captured)captured.classList.add('captured')}
  const dx=tr.left-sr.left, dy=tr.top-sr.top, duration=m.capture?360:300;
  const anim=ghost.animate([
    {transform:'translate3d(0,0,0) scale(.98)'},
    {transform:`translate3d(${dx}px,${dy}px,0) scale(1.035)`},
    {transform:`translate3d(${dx}px,${dy}px,0) scale(1)`}
  ],{duration,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});
  anim.finished.then(()=>{ghost.remove();if(captured)captured.remove();commitMove(m)}).catch(()=>{ghost.remove();commitMove(m)});
}
function commitMove(m){
  const a=apply(S.board,m), oldPiece=S.board[m.from[0]][m.from[1]];
  S.board=a.board;if(m.capture)S.captures[S.turn]++;S.moves++;sound(m.capture?'capture':'move');
  const promoted=!king(oldPiece)&&king(a.piece), more=m.capture?captures(S.board,m.to[0],m.to[1],a.piece):[];
  S.animating=false;
  if(m.capture&&more.length){S.chain=m.to.slice();S.selected=m.to.slice();S.legal=more;render();save();
    if(mode==='ai'&&S.turn==='b'&&!S.winner){aiTimer=setTimeout(()=>{aiTimer=null;ai(true)},140)}
    return
  }
  S.chain=null;S.selected=null;S.turn=opp(S.turn);S.legal=legal(S.board,S.turn);checkEnd();render();
  const landed=cellAt(m.to[0],m.to[1])?.querySelector('.piece');
  if(landed){landed.classList.add('land');if(promoted)landed.classList.add('kinged');setTimeout(()=>landed.classList.remove('land','kinged'),520)}
  save();if(!S.winner&&mode==='ai'&&S.turn==='b')setTimeout(ai,180);
}
function make(m){animateMove(m)}
function checkEnd(){const r=S.board.flat().some(p=>color(p)==='r'),b=S.board.flat().some(p=>color(p)==='b');if(!r)return end('b');if(!b)return end('r');if(!legal(S.board,S.turn).length)return end(opp(S.turn))}
function end(w){cancelAI();S.winner=w;aiBusy=false;stopGameplay();$('resultTitle').textContent=w==='r'?'🏆 Победа!':'Игра окончена';$('resultText').textContent=mode==='ai'?(w==='r'?'Вы победили компьютер. Отличная партия!':'Компьютер победил. Попробуйте ещё раз!'):(w==='r'?'Победили красные!':'Победили чёрные!');$('resultMoves').textContent=S.moves;$('resultCaptures').textContent=S.captures.r+S.captures.b;$('result').classList.remove('hidden');showAdMaybe()}
function undo(){if(aiBusy||S.animating||!S.history.length||S.winner)return;let n=mode==='ai'&&S.turn==='r'?2:1, snap=null;while(n--&&S.history.length)snap=S.history.pop();if(snap){restore(snap);render();save();}}

function save(){try{localStorage.setItem('checkers.pro.save',JSON.stringify({version:2,mode,difficulty,soundOn,state:snapshot()}))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem('checkers.pro.save')||'null');if(!x?.state?.board)return false;mode=x.mode||'ai';difficulty=x.difficulty||2;soundOn=x.soundOn!==false;restore(x.state);gameStarted=true;return true}catch(e){return false}}
function cancelAI(){aiRequest++;if(aiTimer){clearTimeout(aiTimer);aiTimer=null}if(aiWatchdog){clearTimeout(aiWatchdog);aiWatchdog=null}aiBusy=false}
function newGame(){cancelAI();S.animating=false;$('animLayer').innerHTML='';S.board=initial();S.turn='r';S.selected=null;S.legal=legal(S.board,'r');S.history=[];S.captures={r:0,b:0};S.moves=0;S.winner=null;S.chain=null;aiBusy=false;gameStarted=true;$('result').classList.add('hidden');startGameplay();render();save()}

function ai(forced=false){if(aiBusy||S.winner||S.turn!=='b'||(mode!=='ai'))return;aiBusy=true;render();const request=++aiRequest;const legalMoves=S.chain?S.legal:legal(S.board,'b');if(!legalMoves.length){aiBusy=false;checkEnd();render();return}
  const payload={board:S.board,turn:'b',difficulty,maxTime:difficulty===1?250:difficulty===2?900:difficulty===3?2500:5000,forcedMoves:S.chain?legalMoves:null};
  if(worker){worker.postMessage({type:'think',request,...payload});aiWatchdog=setTimeout(()=>{if(request!==aiRequest||!aiBusy)return;aiBusy=false;toast('Компьютер задумался слишком надолго');try{worker.terminate()}catch(e){}worker=null;makeWorker();ai()},Math.max(payload.maxTime+500,1100));return}
  aiTimer=setTimeout(()=>{if(request!==aiRequest||S.winner||S.turn!=='b'){aiBusy=false;return}const ms=S.chain?S.legal:legal(S.board,'b');const m=ms[Math.floor(Math.random()*ms.length)];aiBusy=false;if(m)make(m);},40)}
function makeWorker(){try{worker=new Worker('ai-worker.js');worker.onmessage=e=>{if(e.data.type!=='best'||!aiBusy||e.data.request!==aiRequest)return;if(aiWatchdog){clearTimeout(aiWatchdog);aiWatchdog=null}aiBusy=false;const m=e.data.move; if(m && S.turn==='b' && !S.winner){make(m)}else{checkEnd();render()}};worker.onerror=()=>{worker=null;cancelAI();toast('ИИ перезапущен');makeWorker();if(S.turn==='b'&&mode==='ai'&&!S.winner)ai()}}catch(e){worker=null}}

let audio=null;function sound(type){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=type==='capture'?180:310;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.12);if(navigator.vibrate)navigator.vibrate(type==='capture'?20:8)}catch(e){}}
function toggleSound(){soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊':'🔇';$('menuSound').textContent=soundOn?'Включён':'Выключен';save()}
function toast(t){clearTimeout(toastTimer);$('toast').textContent=t;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}

async function initYandex(){try{if(window.YaGames){ysdk=await YaGames.init();try{ysdk.features?.LoadingAPI?.ready()}catch(e){}}}catch(e){console.warn(e)}}
function startGameplay(){try{ysdk?.features?.GameplayAPI?.start()}catch(e){}}
function stopGameplay(){try{ysdk?.features?.GameplayAPI?.stop()}catch(e){}}
function showAdMaybe(){const n=Number(localStorage.getItem('checkers.pro.games')||0)+1;localStorage.setItem('checkers.pro.games',n);if(n%3!==0||!ysdk?.adv?.showFullscreenAdv)return;try{ysdk.adv.showFullscreenAdv({callbacks:{onClose:startGameplay,onError:startGameplay}})}catch(e){}}

$('newBtn').onclick=newGame;$('undoBtn').onclick=undo;$('againBtn').onclick=newGame;$('soundBtn').onclick=toggleSound;$('menuSound').onclick=toggleSound;$('menuBtn').onclick=()=>{cancelAI();$('menu').classList.remove('hidden');stopGameplay()};$('resultMenuBtn').onclick=()=>{cancelAI();$('result').classList.add('hidden');$('menu').classList.remove('hidden');stopGameplay()};$('startBtn').onclick=()=>{$('menu').classList.add('hidden');newGame()};$('continueBtn').onclick=()=>{
  $('menu').classList.add('hidden');
  if(load()){
    render();startGameplay();
    // A saved AI turn must resume automatically instead of leaving the user
    // on a non-interactive black turn.
    if(mode==='ai'&&S.turn==='b'&&!S.winner) setTimeout(ai,120);
  }else newGame()
};$('aiMode').onclick=()=>{mode='ai';$('aiMode').classList.add('active');$('twoMode').classList.remove('active')};$('twoMode').onclick=()=>{mode='two';$('twoMode').classList.add('active');$('aiMode').classList.remove('active')};$('difficulty').onchange=e=>difficulty=+e.target.value;
window.addEventListener('yandex-sdk-ready',initYandex);
makeWorker();
if(!load()) newGame();
else {
  // Normalize restored state before the first render.
  S.selected=null; S.animating=false; aiBusy=false; S.legal=legal(S.board,S.turn);
  render();startGameplay();
  if(mode==='ai'&&S.turn==='b'&&!S.winner) setTimeout(ai,120);
}
</script>
</body></html>
